<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Card - Rakernas XII JKPI 2026</title>

    <style>
        @page {
            size: 95mm 126mm portrait;
            margin: 0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 95mm;
            height: 126mm;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* ===== DARK TOP SECTION ===== */
        .top-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40mm;
            background: linear-gradient(135deg, #0F2A4A 0%, #1B4D85 100%);
        }

        .geo-1 {
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 30mm 35mm 0;
            border-color: transparent rgba(22, 61, 107, 0.6) transparent transparent;
        }

        .geo-2 {
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 20mm 25mm 0;
            border-color: transparent rgba(27, 77, 133, 0.4) transparent transparent;
        }

        /* ===== LOGO ===== */
        .logo-wrapper {
            position: absolute;
            top: 8mm;
            width: 100%;
            text-align: center;
            color: #fff;
        }

        .logo-text {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .logo-sub {
            font-size: 8px;
            margin-top: 2px;
        }

        .event-name {
            font-size: 7px;
            margin-top: 2px;
        }

        /* ===== PHOTO ===== */
        .photo-wrapper {
            position: absolute;
            top: 30mm;
            width: 100%;
            text-align: center;
        }

        .photo-ring {
            width: 30mm;
            height: 30mm;
            border-radius: 50%;
            border: 3px solid #ffffff;
            overflow: hidden;
            display: inline-block;
        }

        .photo-ring img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ===== INFO ===== */
        .info-wrapper {
            position: absolute;
            top: 65mm;
            width: 100%;
            text-align: center;
            padding: 0 8mm;
        }

        .person-name {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .person-institution {
            font-size: 9px;
            color: #0F2A4A;
            margin-bottom: 3px;
        }

        .person-role {
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .id-badge {
            margin-top: 5px;
            font-size: 8px;
            font-weight: bold;
            color: #fff;
            background: #0F2A4A;
            display: inline-block;
            padding: 3px 8px;
            border-radius: 10px;
        }

        /* ===== QR ===== */
        .qr-wrapper {
            position: absolute;
            bottom: 12mm;
            width: 100%;
            text-align: center;
            display: block;
            margin: 0 auto;
        }

        .qr-placeholder {
            width: 20mm;
            height: 20mm;
            border: 1px solid #ccc;
            font-size: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .qr-label {
            font-size: 6px;
            margin-top: 2px;
            color: #666;
        }

        .bottom-line {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 4mm;
            background: linear-gradient(90deg, #0F2A4A 0%, #1B4D85 50%, #0F2A4A 100%);
        }
    </style>
</head>

<body>
    <div class="card">

        <div class="top-bg"></div>
        <div class="geo-1"></div>
        <div class="geo-2"></div>

        <div class="logo-wrapper">
            <div class="logo-text">JKPI</div>
            <div class="logo-sub">Jaringan Kota Pusaka Indonesia</div>
            <div class="event-name">RAKERNAS XII 2026 • TERNATE</div>
        </div>

        <div class="photo-wrapper">
            <div class="photo-ring">
                <img src="https://i.pravatar.cc/300?img=12">
            </div>
        </div>

        <div class="info-wrapper">
            <div class="person-name">Dr. Ahmad Hidayat, M.Si</div>
            <div class="person-institution">Pemerintah Kota Ternate</div>
            <div class="person-role">Peserta</div>
            <div class="id-badge">ID: JKPI-2026-001</div>
        </div>

        <div class="qr-wrapper">
            <div class="qr-placeholder">QR CODE</div>
            <div class="qr-label">Scan untuk verifikasi</div>
        </div>

        <div class="bottom-line"></div>

    </div>
</body>

</html>
